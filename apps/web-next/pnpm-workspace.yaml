# Standalone project root marker.
#
# Without this file pnpm walks UP, finds the repo-root pnpm-workspace.yaml, and
# treats this app as part of the backend workspace — which would put its deps in
# the root lockfile and break the Docker build (it copies only this directory).
# An empty package list makes this directory its own workspace root.
packages: []

# Transitive version pins. pnpm reads overrides from here (the npm `overrides`
# field in package.json is npm-only and is ignored).
overrides:
  # Next 16.2.11 still declares `sharp: ^0.34.5`, which cannot reach the version
  # that patches the libvips CVEs (GHSA-f88m-g3jw-g9cj, fixed in 0.35.0). Force
  # the patched line. Drop this once Next widens its own range.
  sharp: 0.35.3
  # Pinned to keep the transitive postcss on a known-good version.
  postcss: 8.5.10
