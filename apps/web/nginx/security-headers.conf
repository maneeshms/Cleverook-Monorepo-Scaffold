# Security response headers for the frontend origin (the server that ships the
# HTML/JS). The API sets its own via helmet; these harden the page origin itself.
#
# nginx gotcha: `add_header` is inherited from an outer block ONLY if the inner
# block declares no `add_header` of its own. So this snippet is `include`d into
# every HTML/asset location rather than set once at server level — a location
# that adds its own Cache-Control would otherwise silently drop all of these.
# It is deliberately NOT included in the /api/ proxy location: those responses
# already carry the API's headers, and a second CSP there would just conflict.
#
# `always` = send on error responses (4xx/5xx) too, not only 2xx/3xx.

# Clickjacking: this app is never meant to be framed. frame-ancestors (CSP)
# is the modern control; X-Frame-Options covers older browsers.
add_header X-Frame-Options "DENY" always;
# Stop content-type sniffing (MIME-confusion / drive-by execution).
add_header X-Content-Type-Options "nosniff" always;
# Don't leak full URLs (paths, query) to cross-origin destinations.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Drop ambient access to powerful features this app doesn't use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Force HTTPS on repeat visits. Only honoured over HTTPS (Railway terminates TLS),
# ignored over plain-HTTP local runs. Drop includeSubDomains if you serve other
# services on sibling subdomains that are not yet HTTPS-only.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content-Security-Policy — pragmatic baseline for a built Vite SPA (external,
# hashed scripts → script-src 'self' with no inline needed). style-src allows
# 'unsafe-inline' because the design kit emits inline styles; tightening to a
# nonce/hash is a per-project follow-up. connect-src is 'self' (same-origin
# /api proxy) — add `wss:` here if you enable the realtime capability.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
